<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, userscalable=no">
    <title>Bharat Maps</title>
    <link rel="stylesheet" href="https://js.arcgis.com/3.41/esri/css/esri.css">
    <style>
        html,
        body,
        #map {
            height: 100%;
            padding: 0;
            margin: 0;
        }
    </style>
    <script src="https://js.arcgis.com/3.41/"></script>
    <script>
        var map;
        var boundary_layer;
        var district_boundary;
        require(["esri/map","esri/layers/ArcGISDynamicMapServiceLayer","dojo/domReady!"], function (Map, ArcGISDynamicMapServiceLayer) {
            map = new Map(
                "map",
                {
                    logo:false,
                    showAttribution:false,
                    basemap: "streets-navigation-vector",
                    center: [88.133222, 25.034102], // longitude, latitude         
                    zoom: 9
                });

            district_boundary = {
                url: 'https://mapservice.gov.in/gismapservice/rest/services/BharatMapService/District_Boundary/MapServer', 
                token: "nsLc1KRPwxTF0KJFXOPVA0Fv0DeRo__iRHhPFbWOSELA9gRDMsXUzardFauwHqJKauUcDQqZTfUflPvplEd8wA.."
            };

            boundary_layer = new ArcGISDynamicMapServiceLayer(
                district_boundary.url + "?token=" + district_boundary.token + "", 
                { id: "India"}
            );
            // map.addLayers([boundary_layer]);
        });
    </script>
</head>

<body>
    <div id="map"></div>
</body>

</html>
