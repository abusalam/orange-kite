<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, userscalable=no">
    <title>Bharat Maps</title>
    <link rel="stylesheet" href="https://js.arcgis.com/3.41/esri/css/esri.css">
    <link rel="stylesheet" href="https://js.arcgis.com/3.41/dijit/themes/claro/claro.css">
    <style>
        html,
        body {
            height: 100%;
            padding: 0;
            margin: 0;
        }

        li {
            padding-bottom: 5px;
            padding-top: 5px;
        }

        #leftPane {
            width: 20%;
        }

        #legendPane {
            border: solid #97DCF2 1px;
        }

        .watermark-nic {
            width: 160px;
            position: fixed;
            z-index: 99;
            bottom: 18px;
            right: 0;
            left: 0;
            margin: 0 auto;
            opacity: 1;
        }

        .header {
            position: absolute;
            z-index: 9;
            background: white;
            padding: 1rem;
            left: 27px;
            top: 27px;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3), 0 4px 8px 3px rgba(60, 64, 67, 0.15);
            width: 300px;
            border-radius: 1rem;
            transition: 0.45s;
            opacity: 0;
        }
    </style>
    <script src="https://js.arcgis.com/3.41/"></script>
    <script>
        function hotkeyControl(event) {
            // this would test for whichever key is 40 (down arrow) and the ctrl key at the same time
            if (event.ctrlKey && event.code === 'ArrowDown') {
                document.getElementById('mapControl').style.opacity = 1;
            }
        }
        document.addEventListener('keyup', hotkeyControl, false);

        var map;
        var lgd_district_code = "332"; // Malda District Code
        var boundary_layer;
        var district_boundary_layer;
        var boundary_service;
        var district_boundary_layer_service;
        fetch('bharat-maps/' + window.location.hostname + '_tokens.json')
            .then((response) => response.json())
            .then((json) => {
                // console.log(json);

                district_boundary_layer_service = json.District_Boundary;
                boundary_service = json.Admin_Boundary_GramPanchayat;
                bharat_map_service = json.Map_ServiceURL;
                require([
                    "esri/map",
                    "esri/geometry/Extent",
                    "esri/SpatialReference",
                    "esri/layers/ArcGISDynamicMapServiceLayer",
                    "esri/InfoTemplate",
                    "esri/tasks/query",
                    "esri/tasks/QueryTask",
                    "esri/layers/GraphicsLayer",
                    "esri/graphic",
                    "esri/symbols/PictureMarkerSymbol",
                    "esri/symbols/SimpleLineSymbol",
                    "esri/symbols/SimpleFillSymbol",
                    "esri/Color",
                    "dojo/parser",
                    "dojo/domReady!"
                ], function (
                    Map,
                    Extent,
                    SpatialReference,
                    ArcGISDynamicMapServiceLayer,
                    InfoTemplate,
                    Query,
                    QueryTask,
                    GraphicsLayer,
                    Graphic,
                    PictureMarkerSymbol,
                    SimpleLineSymbol,
                    SimpleFillSymbol,
                    Color,
                    parser
                ) {
                    parser.parse();
                    map = new Map("map",
                        {
                            logo: false,
                            title: "Bharat Maps",
                            slider: true,
                            sliderPosition: "top-right",
                            showAttribution: false,
                            basemap: "topo-vector",
                            center: [88.133222, 25.034102], // longitude, latitude         
                            zoom: 9
                        });
                    var ind_ext = new Extent(66.62, 5.23, 98.87, 38.59, new SpatialReference({ wkid: 4326 }));
                    map.setExtent(ind_ext.expand(1.2));

                    boundary_layer = new ArcGISDynamicMapServiceLayer(
                        boundary_service.URL + "?token=" + boundary_service.Token + "",
                        { id: "India" }
                    );
                    boundary_layer.setLayerDefinitions([
                        "dtcode11='" + lgd_district_code + "'",
                        "dtcode11='" + lgd_district_code + "'",
                        "dtcode11='" + lgd_district_code + "'",
                        "dtcode11='" + lgd_district_code + "'",
                        "dtcode11='" + lgd_district_code + "'",
                    ]);
                    var layer_info = new InfoTemplate();
                    layer_info.setTitle("<b>${block_name}</b>");
                    boundary_layer.setInfoTemplates({ 2: { infoTemplate: layer_info } });
                    map.addLayers([boundary_layer]);
                    var graphlayer = new GraphicsLayer();
                    map.addLayer(graphlayer);

                    showBoundary(lgd_district_code);
                    showMarker(lgd_district_code);

                    function showBoundary(dt_code) {
                        var qt = new QueryTask(district_boundary_layer_service.URL + "/0?token=" + district_boundary_layer_service.Token + "");
                        var q = new Query();
                        q.returnGeometry = true;
                        q.outFields = ["*"];
                        // q.outSpatialReference = { wkid: 102100 };
                        q.where = "DTCODE11='" + dt_code + "'";
                        qt.execute(q, function (fset) {
                            // graphlayer.clear();
                            if (fset.features.length > 0) {
                                var geo = fset.features[0].geometry;
                                var symbol = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
                                    new SimpleLineSymbol(SimpleLineSymbol.STYLE_SOLID,
                                        new Color([115, 178, 255]), 3),
                                    new Color([115, 178, 255, 0.1]));
                                var graphic = new Graphic(geo, symbol);
                                graphlayer.add(graphic);
                                
                                setTimeout(function () {
                                    map.setExtent(fset.features[0].geometry.getExtent(), true);
                                }, 2000);
                            }
                            else {
                                alert("There is no District HQ");
                            }
                        }, function (error) {
                            console.log(error);
                        });
                    }

                    function showMarker(dt_code) {
                        var qt = new QueryTask(bharat_map_service + "/1?token=");
                        var q = new Query();
                        q.returnGeometry = true;
                        q.outFields = ["*"];
                        // q.outSpatialReference = { wkid: 102100 };
                        q.where = "DTCODE11='" + dt_code + "'";
                        qt.execute(q, function (fset) {
                            // graphlayer.clear();
                            if (fset.features.length > 0) {
                                var geo = fset.features[0].geometry;
                                var markersymbol = new PictureMarkerSymbol({
                                    "url": "marker.png",
                                    "height": "30",
                                    "width": "30",
                                    "yoffset": 15,
                                    "xoffset": 0
                                });
                                graphlayer.add(new Graphic(geo, markersymbol, null, null));
                                var font = new esri.symbol.Font("20px", esri.symbol.Font.STYLE_NORMAL, esri.symbol.Font.VARIANT_NORMAL, esri.symbol.Font.WEIGHT_BOLDER);
                                var endpoint = new esri.symbol.TextSymbol(fset.features[0].attributes.DTNAME).setFont(font).setColor(new esri.Color([0, 120, 255])).setOffset(0, 45);
                                var endpointText = new Graphic(geo, endpoint, null, null);
                                graphlayer.add(endpointText);
                                // console.log(fset.features[0].attributes);
                            }
                            else {
                                alert("There is no District HQ");
                            }
                        }, function (error) {
                            console.log(error);
                        });
                    }
                });
            })
            .catch((error) => {
                console.error('Error fetching tokens:', error);
                alert('Failed to load tokens. Please add "bharat-maps/<hostname>_tokens.json" file with valid tokens.');
            });
    </script>
</head>

<body>
    <div id="mapControl" class="header only">
        <div class="inner">
            <div class="d-flex flex-stack">
                <ol>
                    <li>
                        <a href="https://bharatnetprogress.nic.in/Bharatmaps_s3wass/?dtcode=332" target="_blank">
                            District Boundary
                        </a>
                    </li>
                    <li>
                        <a href="blocks.html" target="_blank">
                            Block Boundaries
                        </a>
                    </li>
                </ol>
            </div>
        </div>
    </div>
    <div id="map" data-dojo-type="dijit/layout/ContentPane" data-dojo-props="region:'center'"
        style="width: 100%; height: 100vh" style="overflow:hidden;">
    </div>
    <img src="watermarknic.png" class="watermark-nic" alt="">
</body>

</html>
