<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, userscalable=no">
    <title>Bharat Maps</title>
    <link rel="stylesheet" href="https://js.arcgis.com/3.41/esri/css/esri.css">
    <style>
        html,
        body,
        #map {
            height: 100%;
            padding: 0;
            margin: 0;
        }
        .watermark-nic {
            width: 160px;
            position: fixed;
            z-index: 99;
            bottom: 18px;
            right: 0;
            left: 0;
            margin: 0 auto;
            opacity: 1;
        }
    </style>
    <script src="https://js.arcgis.com/3.41/"></script>
    <script>
        var map;
        var boundary_layer;
        var boundary_service;
        var district_boundary_layer_service;
        fetch('bharat-maps/' + window.location.hostname + '_tokens.json')
            .then((response) => response.json())
            .then((json) => {
                // console.log(json);
                boundary_service = json.Block_Boundary;
                district_boundary_layer_service = json.District_Boundary;
                require([
                    "esri/map",
                    "esri/geometry/Extent",
                    "esri/SpatialReference",
                    "esri/layers/ArcGISDynamicMapServiceLayer",
                    "esri/InfoTemplate",
                    "esri/tasks/query",
                    "esri/tasks/QueryTask",
                    "esri/layers/GraphicsLayer",
                    "esri/graphic",
                    "esri/symbols/PictureMarkerSymbol",
                    "esri/symbols/SimpleLineSymbol",
                    "esri/symbols/SimpleFillSymbol",
                    "esri/Color",
                    "dojo/parser",
                    "dojo/domReady!"
                ], function (
                    Map,
                    Extent,
                    SpatialReference,
                    ArcGISDynamicMapServiceLayer,
                    InfoTemplate,
                    Query,
                    QueryTask,
                    GraphicsLayer,
                    Graphic,
                    PictureMarkerSymbol,
                    SimpleLineSymbol,
                    SimpleFillSymbol,
                    Color,
                    parser
                ) {
                    map = new Map(
                        "map",
                        {
                            logo: false,
                            showAttribution: false,
                            slider: true,
                            sliderPosition: "top-right",
                            basemap: "streets-navigation-vector",
                            center: [88.133222, 25.034102], // longitude, latitude         
                            zoom: 9
                        });

                    var ind_ext = new Extent(66.62, 5.23, 98.87, 38.59, new SpatialReference({ wkid: 4326 }));
                    map.setExtent(ind_ext.expand(1.2));
                    var graphlayer = new GraphicsLayer();
                    map.addLayer(graphlayer);

                    boundary_layer = new ArcGISDynamicMapServiceLayer(
                        boundary_service.URL + "?token=" + boundary_service.Token + "",
                        { id: "India" }
                    );
                    var state_info = new InfoTemplate();
                    state_info.setTitle("<b>${block_name} Block</b>");
                    boundary_layer.setInfoTemplates({ 0: { infoTemplate: state_info } });
                    map.addLayers([boundary_layer]);
                    map.on("load", laodMap);
                    function laodMap() {
                        if (window.location.href.indexOf('?dtcode=') > 0) {
                            var url_string = window.location.href;//"http://www.example.com/t.html?a=1&b=3&c=m2-m3-m4-m5";//
                            var url = new URL(url_string);
                            var dt_code = url.searchParams.get("dtcode");
                            if (dt_code.length == 3) {
                                boundary_layer.setLayerDefinitions(["dtcode11 = '" + dt_code + "'"]);
                                showBoundary(dt_code);
                            }
                        } else {
                            boundary_layer.setLayerDefinitions(["dtcode11 = '332'"]);
                            showBoundary("332");
                        }
                    }

                    function showBoundary(dt_code) {
                        var qt = new QueryTask(district_boundary_layer_service.URL + "/0?token=" + district_boundary_layer_service.Token + "");
                        var q = new Query();
                        q.returnGeometry = true;
                        q.outFields = ["*"];
                        // q.outSpatialReference = { wkid: 102100 };
                        q.where = "DTCODE11='" + dt_code + "'";
                        qt.execute(q, function (fset) {
                            // graphlayer.clear();
                            if (fset.features.length > 0) {
                                var geo = fset.features[0].geometry;
                                var symbol = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
                                    new SimpleLineSymbol(SimpleLineSymbol.STYLE_SOLID,
                                        new Color([115, 178, 255]), 3),
                                    new Color([115, 178, 255, 0.1]));
                                var graphic = new Graphic(geo, symbol);
                                graphlayer.add(graphic);
                                
                                setTimeout(function () {
                                    map.setExtent(fset.features[0].geometry.getExtent(), true);
                                }, 2000);
                            }
                            else {
                                alert("There is no District HQ");
                            }
                        }, function (error) {
                            console.log(error);
                        });
                    }
                });
            })
            .catch((error) => {
                console.error('Error fetching tokens:', error);
                alert('Failed to load tokens. Please add "bharat-maps/<hostname>_tokens.json" file with valid tokens.');
            });
    </script>
</head>

<body>
    <div id="map"></div>
    <img src="watermarknic.png" class="watermark-nic" alt="">
</body>

</html>
